; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[platformio]
default_envs = esp12e

[env]
monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF
monitor_filters = send_on_enter

lib_deps = knolleary/PubSubClient@^2.8

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
build_flags = 
	'-D HOSTNAME="esp_bell_d1_mini"'
	-D IS_ESP8266_D1_MINI_BOARD 
	;-D LOCATION_HOME
	-D LOCATION_10BITWORKS

; --- ADD THESE LINES FOR OTA ---
;upload_protocol = espota
;upload_port = 192.168.1.35    ; Upload using ESP8266's IP address or mDNS hostname (e.g., my-esp8266-device.local)
;upload_port = 10.7.1.190      ; Upload using ESP8266's IP address or mDNS hostname (e.g., my-esp8266-device.local)
;upload_port = esp_bell_d1_mini.local  ; or using mDNS hostname if set (e.g., ArduinoOTA.setHostname("esp_bell");)

; Uncomment if you set an OTA password in your script
; upload_flags = --auth=10bitrocks

[env:esp12e]
platform = espressif8266
board = esp12e
framework = arduino
build_flags = 
	'-D HOSTNAME="esp_bell"'
	-D IS_ESP8266_NODE_NCU_BOARD 
	;-D LOCATION_HOME
	-D LOCATION_10BITWORKS

; --- ADD THESE LINES FOR OTA ---
;upload_protocol = espota
;upload_port = 192.168.1.35    ; Upload using ESP8266's IP address or mDNS hostname (e.g., my-esp8266-device.local)
;upload_port = 10.7.1.149      ; Upload using ESP8266's IP address or mDNS hostname (e.g., my-esp8266-device.local)
;upload_port = esp_bell.local   ; or using mDNS hostname if set (e.g., ArduinoOTA.setHostname("esp_bell");)

; Uncomment if you set an OTA password in your script
; upload_flags = --auth=10bitrocks

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
build_flags = 
	'-D HOSTNAME="esp_bell_esp32"'
	-D IS_ESP32_BOARD
	-D LOCATION_10BITWORKS

; --- ADD THESE LINES FOR OTA ---
;upload_protocol = espota
;upload_port = 192.168.1.35    ; Upload using ESP8266's IP address or mDNS hostname (e.g., my-esp8266-device.local)
;upload_port = 10.7.1.149      ; Upload using ESP8266's IP address or mDNS hostname (e.g., my-esp8266-device.local)
;upload_port = esp_bell.local   ; or using mDNS hostname if set (e.g., ArduinoOTA.setHostname("esp_bell");)

; Uncomment if you set an OTA password in your script
; upload_flags = --auth=10bitrocks